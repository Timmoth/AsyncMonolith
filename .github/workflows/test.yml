name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the integration tests (Testcontainers, slow)
        type: boolean
        default: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Fast tests
      run: dotnet test --project AsyncMonolith.Tests --filter-not-trait "Category=Integration"

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Integration tests
      run: dotnet test --project AsyncMonolith.Tests --filter-trait "Category=Integration"

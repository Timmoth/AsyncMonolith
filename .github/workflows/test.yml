name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Also run the integration tests (Testcontainers, slow)
        type: boolean
        default: false

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Fast tests
      run: >-
        dotnet test --project AsyncMonolith.Tests --filter-not-trait "Category=Integration"
        --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/coverage/fast.cobertura.xml"

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-fast
        path: coverage/

    - name: Pack (checks package validation and metadata)
      run: |
        dotnet pack AsyncMonolith/AsyncMonolith.csproj -c Release --output nupkg
        dotnet pack AsyncMonolith.TestHelpers/AsyncMonolith.TestHelpers.csproj -c Release --output nupkg

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Integration tests
      run: >-
        dotnet test --project AsyncMonolith.Tests --filter-trait "Category=Integration"
        --coverage --coverage-output-format cobertura --coverage-output "$GITHUB_WORKSPACE/coverage/integration.cobertura.xml"

    - name: Upload coverage
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-integration
        path: coverage/
